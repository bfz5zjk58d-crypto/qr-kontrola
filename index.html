
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>QR Kontrola 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:-apple-system,Arial,sans-serif}
main{max-width:550px;margin:auto;padding:22px 16px}
h1{font-size:27px;margin:0 0 6px}
p{color:#b9c5d6;line-height:1.5}
.card{background:#1d2a40;border-radius:18px;padding:18px;margin:16px 0}
button{width:100%;background:#3479f3;color:white;border:0;border-radius:13px;padding:18px;font-size:18px;font-weight:bold;margin:8px 0}
button:disabled{opacity:.5}
video{width:100%;background:#080e18;border-radius:12px;min-height:240px;object-fit:cover}
#status{font-size:14px;white-space:pre-wrap;word-break:break-word}
.result{text-align:center;font-size:32px;font-weight:900;padding:26px;border-radius:15px;margin:14px 0}
.ok{background:#12683e}
.bad{background:#9b2835}
.hidden{display:none}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats strong{font-size:27px;display:block}
.stats span{font-size:12px;color:#b9c5d6}
textarea{width:100%;background:#101827;color:white;border:1px solid #64748b;border-radius:10px;padding:12px;min-height:75px}
small{color:#9eacc0}
</style>
</head>
<body>
<main>
<h1>▣ QR Kontrola 3.0</h1>
<p>Porovnání dvou QR kódů</p>

<div class="card" id="scanPanel">
<h2 id="heading">1. První QR kód</h2>
<p id="hint">Naskenuj první QR kód.</p>
<video id="video" autoplay muted playsinline></video>
<button id="start">Spustit fotoaparát</button>
<p id="status">Verze 3.0 – připraveno</p>
<details>
<summary>Ruční zadání pro test</summary>
<textarea id="manual" placeholder="Obsah QR kódu"></textarea>
<button id="confirm">Potvrdit kód</button>
</details>
</div>

<div class="card hidden" id="resultPanel">
<div id="result" class="result"></div>
<p id="explanation"></p>
<button id="next">Další kontrola</button>
<details>
<summary>Zobrazit načtené hodnoty</summary>
<p>První QR:</p><p id="firstValue"></p>
<p>Druhý QR:</p><p id="secondValue"></p>
</details>
</div>

<div class="card">
<h3>Statistika</h3>
<div class="stats">
<div><strong id="total">0</strong><span>Kontrol</span></div>
<div><strong id="matches">0</strong><span>Shoda</span></div>
<div><strong id="errors">0</strong><span>Neshoda</span></div>
</div>
<button id="reset">Vynulovat statistiku</button>
</div>
<small>QR kódy se porovnávají podle přesného obsahu. Data zůstávají v telefonu.</small>
</main>

<script>
"use strict";
const el=id=>document.getElementById(id);
let stage=0,first="",stream=null,detector=null;
let active=false,processing=false;
let total=0,matches=0,errors=0;
let fallback=null;

function status(s){el("status").textContent=s}

function updateStats(){
 el("total").textContent=total;
 el("matches").textContent=matches;
 el("errors").textContent=errors;
}

function stop(){
 active=false;
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }
 el("video").srcObject=null;
}

function loadFallback(){
 return new Promise((resolve,reject)=>{
  if(window.jsQR){resolve();return}
  const s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
  s.onload=resolve;
  s.onerror=()=>reject(new Error("Nelze načíst záložní QR skener. Zkontroluj internet."));
  document.head.appendChild(s);
 });
}

async function startCamera(){
 if(active||processing)return;
 processing=true;
 el("start").disabled=true;
 status("Tlačítko funguje. Žádám o přístup k fotoaparátu...");
 try{
  if(!window.isSecureContext)throw new Error("Otevři aplikaci přes HTTPS.");
  if(!navigator.mediaDevices?.getUserMedia)
   throw new Error("Prohlížeč nepodporuje přístup ke kameře.");

  detector=null;
  if("BarcodeDetector" in window){
   try{
    const supported=await BarcodeDetector.getSupportedFormats();
    if(supported.includes("qr_code"))
     detector=new BarcodeDetector({formats:["qr_code"]});
   }catch(e){}
  }
  if(!detector)await loadFallback();

  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{facingMode:{ideal:"environment"}}
  });
  const video=el("video");
  video.srcObject=stream;
  await video.play();
  active=true;
  el("start").classList.add("hidden");
  status("Fotoaparát běží. Namiř na QR kód.");
  requestAnimationFrame(scan);
 }catch(e){
  stop();
  let msg=e.message||String(e);
  if(e.name==="NotAllowedError")
   msg="Přístup ke kameře byl zamítnut. Povol jej v Safari.";
  status("CHYBA: "+msg);
  el("start").classList.remove("hidden");
 }finally{
  processing=false;
  el("start").disabled=false;
 }
}

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

async function scan(){
 if(!active)return;
 const video=el("video");
 if(video.readyState>=2&&video.videoWidth>0){
  try{
   let value=null;
   if(detector){
    const codes=await detector.detect(video);
    if(codes.length)value=codes[0].rawValue;
   }else if(window.jsQR){
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
    const code=jsQR(pixels.data,canvas.width,canvas.height,{
     inversionAttempts:"attemptBoth"
    });
    if(code)value=code.data;
   }
   if(value!==null){
    accept(value);
    return;
   }
  }catch(e){
   status("Chyba čtení: "+e.message);
  }
 }
 if(active)setTimeout(()=>requestAnimationFrame(scan),130);
}

function sound(ok){
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return;
  const a=new Audio(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);
  o.frequency.value=ok?900:280;
  g.gain.value=.08;
  o.start();o.stop(a.currentTime+.2);
  o.onended=()=>a.close();
 }catch(e){}
}

function accept(value){
 if(processing||stage===2)return;
 stop();
 el("start").classList.remove("hidden");
 if(stage===0){
  first=value;
  stage=1;
  el("heading").textContent="2. Druhý QR kód";
  el("hint").textContent="Naskenuj druhý QR kód.";
  el("start").textContent="Skenovat druhý QR";
  status("První QR byl uložen.");
  el("manual").value="";
 }else{
  stage=2;
  const ok=first===value;
  total++;
  if(ok)matches++;else errors++;
  updateStats();
  el("result").className="result "+(ok?"ok":"bad");
  el("result").textContent=ok?"✓ SHODA":"✕ NESHODA";
  el("explanation").textContent=ok?
   "Oba QR kódy jsou totožné.":
   "QR kódy obsahují rozdílná data.";
  el("firstValue").textContent=first;
  el("secondValue").textContent=value;
  el("scanPanel").classList.add("hidden");
  el("resultPanel").classList.remove("hidden");
  sound(ok);
 }
}

el("start").addEventListener("click",startCamera);
el("confirm").addEventListener("click",()=>{
 const value=el("manual").value;
 if(!value){status("Zadej obsah QR kódu.");return}
 accept(value);
});
el("next").addEventListener("click",()=>{
 stop();
 stage=0;first="";
 el("heading").textContent="1. První QR kód";
 el("hint").textContent="Naskenuj první QR kód.";
 el("start").textContent="Spustit fotoaparát";
 el("start").classList.remove("hidden");
 el("scanPanel").classList.remove("hidden");
 el("resultPanel").classList.add("hidden");
 el("manual").value="";
 status("Připraveno na další kontrolu.");
});
el("reset").addEventListener("click",()=>{
 total=matches=errors=0;updateStats();
});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden&&active){
  stop();
  el("start").classList.remove("hidden");
  status("Fotoaparát pozastaven.");
 }
});
</script>
</body>
</html>
