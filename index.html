
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Kontrola 4.5 FAST</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 23px;
    margin: 8px 0;
}

.subtitle {
    color: #aab8cb;
    font-size: 13px;
    margin-bottom: 12px;
}

.camera {
    position: relative;
    overflow: hidden;
    border-radius: 14px;
    background: black;
}

video {
    width: 100%;
    max-height: 42vh;
    object-fit: contain;
    display: block;
}

.frame {
    position: absolute;
    inset: 15%;
    border: 2px solid #38bdf8;
    border-radius: 14px;
    pointer-events: none;
}

button {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 18px;
    margin-top: 10px;
    font-size: 19px;
    font-weight: bold;
    color: white;
    background: #2563eb;
}

button:disabled {
    opacity: 0.6;
}

.codes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

.codebox {
    background: #263345;
    padding: 15px 5px;
    border-radius: 12px;
    min-height: 90px;
    border: 2px solid transparent;
}

.loaded {
    background: #14532d;
    border-color: #4ade80;
}

.codevalue {
    font-size: 14px;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

#status {
    font-size: 19px;
    font-weight: bold;
    padding: 15px 5px;
}

#result {
    padding: 20px 5px;
    border-radius: 15px;
    margin-top: 10px;
    font-size: 40px;
    font-weight: 900;
}

.green {
    background: #00852c;
}

.red {
    background: #b90000;
}

.waiting {
    background: #263345;
    font-size: 22px !important;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.stats strong {
    display: block;
    font-size: 25px;
    margin-top: 6px;
}

#next {
    font-size: 27px;
    padding: 22px;
}

#note {
    font-size: 12px;
    color: #aab8cb;
    margin-top: 15px;
}
</style>
</head>

<body>

<h1>QR Kontrola 4.5 FAST</h1>

<div class="subtitle">
    Knižní blok + desky
</div>

<div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="frame"></div>
</div>

<button id="start" onclick="startCamera()">
    SPUSTIT KAMERU
</button>

<div class="codes">

    <div class="codebox" id="blockBox">
        <strong>BLOK</strong>
        <div class="codevalue" id="blockValue">
            Čekám na QR
        </div>
    </div>

    <div class="codebox" id="coverBox">
        <strong>DESKY</strong>
        <div class="codevalue" id="coverValue">
            Čekám na QR
        </div>
    </div>

</div>

<div id="status">
    Spusťte kameru
</div>

<div id="result" class="waiting">
    ČEKÁM
</div>

<button id="next" onclick="nextCheck()">
    DALŠÍ
</button>

<div class="stats">

    <div>
        SHODA
        <strong id="okCount">0</strong>
    </div>

    <div>
        NESHODA
        <strong id="badCount">0</strong>
    </div>

    <div>
        CELKEM
        <strong id="totalCount">0</strong>
    </div>

</div>

<div id="note">
    Černý QR = blok | Bílý QR = desky
</div>

<script>

const $ = id => document.getElementById(id);

const video = $("video");

const canvas = document.createElement("canvas");

const ctx = canvas.getContext(
    "2d",
    { willReadFrequently: true }
);

let stream = null;
let running = false;
let starting = false;
let finished = false;

let block = null;
let cover = null;

let okCount = 0;
let badCount = 0;

let audioContext = null;
let lastScan = 0;
let frameNumber = 0;
let animationId = null;

// Rychlost snímání

const SCAN_INTERVAL = 40;
const SCAN_SIZE = 960;


// Zvuková signalizace

function beep(success) {

    try {

        if (!audioContext) return;

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.frequency.value =
            success ? 1000 : 220;

        gain.gain.value = 0.18;

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            (success ? 0.15 : 0.5)
        );

    } catch (error) {}

}


// Spuštění kamery

async function startCamera() {

    if (starting || running) return;

    starting = true;

    $("start").disabled = true;

    try {

        if (!audioContext) {

            const Audio =
                window.AudioContext ||
                window.webkitAudioContext;

            if (Audio) {
                audioContext = new Audio();
            }

        }

        if (audioContext) {
            audioContext.resume().catch(() => {});
        }

        if (typeof jsQR !== "function") {
            throw new Error(
                "QR knihovna není dostupná."
            );
        }

        stream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                }

            });

        video.srcObject = stream;

        await video.play();

        running = true;

        $("start").innerText =
            "KAMERA AKTIVNÍ";

        $("start").style.background =
            "#166534";

        $("status").innerText =
            "Načtěte blok nebo desky";

        scanLoop();

    } catch (error) {

        if (stream) {

            stream.getTracks().forEach(
                track => track.stop()
            );

        }

        stream = null;
        running = false;

        $("start").disabled = false;

        $("status").innerText =
            "Nelze spustit kameru";

        $("note").innerText =
            error.message;

    } finally {

        starting = false;

    }

}


// ČERNÝ QR KÓD – BLOK

function decodeNormal(image) {

    return jsQR(

        image.data,
        image.width,
        image.height,

        {
            inversionAttempts: "dontInvert"
        }

    );

}


// BÍLÝ QR KÓD – DESKY
// Opravená ruční inverze obrazu

function decodeInverted(image) {

    const pixels = image.data;

    for (let i = 0; i < pixels.length; i += 4) {

        pixels[i] =
            255 - pixels[i];

        pixels[i + 1] =
            255 - pixels[i + 1];

        pixels[i + 2] =
            255 - pixels[i + 2];

    }

    return jsQR(

        pixels,
        image.width,
        image.height,

        {
            inversionAttempts: "dontInvert"
        }

    );

}


// Hlavní snímací smyčka

function scanLoop() {

    if (!running) return;

    animationId =
        requestAnimationFrame(scanLoop);

    if (finished) return;

    if (video.readyState < 2) return;

    const now = performance.now();

    if (now - lastScan < SCAN_INTERVAL) {
        return;
    }

    lastScan = now;

    const width = video.videoWidth;
    const height = video.videoHeight;

    if (!width || !height) return;

    const scale = Math.min(
        1,
        SCAN_SIZE / Math.max(width, height)
    );

    const w = Math.round(width * scale);
    const h = Math.round(height * scale);

    if (
        canvas.width !== w ||
        canvas.height !== h
    ) {

        canvas.width = w;
        canvas.height = h;

    }

    try {

        ctx.drawImage(
            video,
            0,
            0,
            w,
            h
        );

        const image = ctx.getImageData(
            0,
            0,
            w,
            h
        );

        // Máme BLOK.
        // Hledáme pouze bílé QR desek.

        if (block !== null && cover === null) {

            const qr = decodeInverted(image);

            if (qr) {
                acceptCover(qr.data);
            }

            return;

        }

        // Máme DESKY.
        // Hledáme pouze černé QR bloku.

        if (cover !== null && block === null) {

            const qr = decodeNormal(image);

            if (qr) {
                acceptBlock(qr.data);
            }

            return;

        }

        // Zatím nemáme žádný QR.
        // Střídáme obě polarity.

        frameNumber++;

        if (frameNumber % 2 === 0) {

            const qr = decodeNormal(image);

            if (qr) {
                acceptBlock(qr.data);
            }

        } else {

            const qr = decodeInverted(image);

            if (qr) {
                acceptCover(qr.data);
            }

        }

    } catch (error) {

        $("note").innerText =
            "Chyba čtení QR: " +
            error.message;

    }

}


// Načtení BLOKU

function acceptBlock(value) {

    if (
        finished ||
        block !== null ||
        !value
    ) return;

    block = String(value);

    $("blockValue").innerText = block;

    $("blockBox").classList.add("loaded");

    $("status").innerText =
        "BLOK OK – načtěte DESKY";

    compareCodes();

}


// Načtení DESEK

function acceptCover(value) {

    if (
        finished ||
        cover !== null ||
        !value
    ) return;

    cover = String(value);

    $("coverValue").innerText = cover;

    $("coverBox").classList.add("loaded");

    $("status").innerText =
        "DESKY OK – načtěte BLOK";

    compareCodes();

}


// Porovnání obou QR kódů

function compareCodes() {

    if (finished) return;

    if (block === null || cover === null) {
        return;
    }

    finished = true;

    if (block === cover) {

        $("result").innerText =
            "✓ SHODA";

        $("result").className =
            "green";

        $("status").innerText =
            "BLOK A DESKY SOUHLASÍ";

        okCount++;

        beep(true);

        if (navigator.vibrate) {
            navigator.vibrate(100);
        }

    } else {

        $("result").innerText =
            "✕ NESHODA";

        $("result").className =
            "red";

        $("status").innerText =
            "POZOR – QR KÓDY SE LIŠÍ";

        badCount++;

        beep(false);

        if (navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }

    }

    $("okCount").innerText =
        okCount;

    $("badCount").innerText =
        badCount;

    $("totalCount").innerText =
        okCount + badCount;

}


// Další kontrola
// Kamera zůstává zapnutá

function nextCheck() {

    block = null;
    cover = null;
    finished = false;
    frameNumber = 0;
    lastScan = 0;

    $("blockValue").innerText =
        "Čekám na QR";

    $("coverValue").innerText =
        "Čekám na QR";

    $("blockBox").classList.remove("loaded");

    $("coverBox").classList.remove("loaded");

    $("result").innerText =
        "ČEKÁM";

    $("result").className =
        "waiting";

    $("status").innerText =
        "Načtěte blok nebo desky";

    if (!running) {
        startCamera();
    }

}


// Ukončení kamery při odchodu

window.addEventListener("pagehide", () => {

    running = false;

    if (animationId !== null) {
        cancelAnimationFrame(animationId);
    }

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }

    stream = null;

    video.srcObject = null;

    $("start").disabled = false;

    $("start").innerText =
        "SPUSTIT KAMERU";

    $("start").style.background =
        "#2563eb";

    nextReset();

});

function nextReset() {

    block = null;
    cover = null;
    finished = false;

    $("blockValue").innerText = "Čekám na QR";
    $("coverValue").innerText = "Čekám na QR";

    $("blockBox").classList.remove("loaded");
    $("coverBox").classList.remove("loaded");

    $("result").innerText = "ČEKÁM";
    $("result").className = "waiting";

    $("status").innerText = "Spusťte kameru";

}

</script>

</body>
</html>
